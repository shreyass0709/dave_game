<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANGEROUS ADVENTURE - A Retro Platformer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="arcade-cabinet">
    <header class="game-header">
      <div class="game-title">DANGEROUS ADVENTURE</div>
      <div class="game-subtitle">A Retro Platformer | College Mini-Project</div>
    </header>

    <div class="screen-frame">
      <canvas id="gameCanvas" width="400" height="240"></canvas>
    </div>

    <footer class="controls-panel">
      <div class="controls-guide">
        <div class="control-item">
          <span class="key-badge">A</span> / <span class="key-badge">◀</span> : Move Left
        </div>
        <div class="control-item">
          <span class="key-badge">D</span> / <span class="key-badge">▶</span> : Move Right
        </div>
        <div class="control-item">
          <span class="key-badge">W</span> / <span class="key-badge">▲</span> / <span class="key-badge">Space</span> : Jump
        </div>
        <div class="control-item">
          <span class="key-badge">F</span> : Shoot Blaster
        </div>
        <div class="control-item">
          <span class="key-badge">P</span> / <span class="key-badge">ESC</span> : Pause Game
        </div>
        <div class="control-item">
          <span class="key-badge">Enter</span> / <span class="key-badge">Mouse</span> : Select
        </div>
      </div>
      <div class="status-indicator">
        <span class="status-dot"></span> Game State Engine: Active (60 FPS) | Dual Input: Keyboard & Mouse
      </div>
    </footer>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
