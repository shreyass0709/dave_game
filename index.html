<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANGEROUS ADVENTURE - A Retro Platformer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="arcade-cabinet">
    <header class="game-header">
      <div class="header-content">
        <div class="header-titles">
          <h1 class="game-title">DANGEROUS ADVENTURE</h1>
          <div class="game-subtitle">A Retro Platformer</div>
        </div>

        <div class="header-actions">
          <!-- Hoverable Controls Button & Popover Tooltip -->
          <div class="controls-dropdown-wrapper" id="controlsWrapper">
            <button id="btnHelp" class="arcade-btn" aria-label="Controls" title="Hover to view controls">
              <span class="btn-icon">🎮</span> CONTROLS
            </button>
            <div class="controls-popover" id="controlsPopover">
              <div class="popover-header">⚡ TACTICAL CONTROLS</div>
              <div class="popover-grid">
                <div class="popover-item">
                  <span class="key-cap">A</span> / <span class="key-cap">◀</span>
                  <span class="popover-label">Move Left</span>
                </div>
                <div class="popover-item">
                  <span class="key-cap">D</span> / <span class="key-cap">▶</span>
                  <span class="popover-label">Move Right</span>
                </div>
                <div class="popover-item">
                  <span class="key-cap">W</span> / <span class="key-cap">▲</span> / <span class="key-cap">Space</span>
                  <span class="popover-label">Jump</span>
                </div>
                <div class="popover-item">
                  <span class="key-cap">F</span>
                  <span class="popover-label">Plasma Blaster</span>
                </div>
                <div class="popover-item">
                  <span class="key-cap">P</span> / <span class="key-cap">ESC</span>
                  <span class="popover-label">Pause / Menu</span>
                </div>
                <div class="popover-item">
                  <span class="key-cap">Enter</span> / <span class="key-cap">Mouse</span>
                  <span class="popover-label">Select / Click</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Fullscreen Button -->
          <button id="btnFullscreen" class="arcade-btn" aria-label="Toggle Fullscreen" title="Toggle Fullscreen (or Double-Click Game Screen)">
            <span class="btn-icon">⛶</span> FULLSCREEN
          </button>
        </div>
      </div>
    </header>

    <div class="screen-frame">
      <canvas id="gameCanvas" width="400" height="240"></canvas>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
