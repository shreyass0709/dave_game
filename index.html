<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANGEROUS ADVENTURE - A Retro Platformer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Top Action Toolbar -->
    <header class="game-toolbar">
      <div class="toolbar-brand">
        <span class="brand-title">DANGEROUS ADVENTURE</span>
        <span class="brand-badge">ARCADE EDITION</span>
      </div>
      <div class="toolbar-actions">
        <button id="btnHelp" class="action-pill-btn" title="View Game Controls & Tips">
          <span class="btn-icon">⌨</span> CONTROLS
        </button>
        <button id="btnFullscreen" class="action-pill-btn" title="Toggle Fullscreen Mode">
          <span class="btn-icon">⛶</span> FULLSCREEN
        </button>
      </div>
    </header>

    <!-- Fullscreen Game Canvas Frame -->
    <main class="viewport-wrapper">
      <div class="screen-frame crt-active">
        <canvas id="gameCanvas" width="400" height="240"></canvas>
      </div>
    </main>

    <!-- Controls & Help Modal Overlay -->
    <div id="controlsModal" class="modal-backdrop hidden">
      <div class="modal-container">
        <div class="modal-header">
          <div class="modal-title-group">
            <h2 class="modal-title">TACTICAL CONTROLS</h2>
            <p class="modal-subtitle">MASTER THE DAVE PROTOCOL</p>
          </div>
          <button id="btnCloseModal" class="modal-close" aria-label="Close Controls Guide">&times;</button>
        </div>

        <div class="modal-body">
          <div class="controls-grid">
            <div class="control-card">
              <div class="control-keys">
                <span class="key-cap">A</span>
                <span class="key-sep">/</span>
                <span class="key-cap">◀</span>
              </div>
              <span class="control-label">Move Left</span>
            </div>

            <div class="control-card">
              <div class="control-keys">
                <span class="key-cap">D</span>
                <span class="key-sep">/</span>
                <span class="key-cap">▶</span>
              </div>
              <span class="control-label">Move Right</span>
            </div>

            <div class="control-card full-span">
              <div class="control-keys">
                <span class="key-cap">Space</span>
                <span class="key-sep">/</span>
                <span class="key-cap">W</span>
                <span class="key-sep">/</span>
                <span class="key-cap">▲</span>
              </div>
              <span class="control-label">Jump (Hold for Maximum Height)</span>
            </div>

            <div class="control-card">
              <div class="control-keys">
                <span class="key-cap">F</span>
              </div>
              <span class="control-label">Shoot Plasma Blaster</span>
            </div>

            <div class="control-card">
              <div class="control-keys">
                <span class="key-cap">P</span>
                <span class="key-sep">/</span>
                <span class="key-cap">ESC</span>
              </div>
              <span class="control-label">Pause / Menu / Back</span>
            </div>

            <div class="control-card full-span">
              <div class="control-keys">
                <span class="key-cap">Enter</span>
                <span class="key-sep">/</span>
                <span class="key-cap">Mouse Click</span>
              </div>
              <span class="control-label">Select / Confirm Action</span>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <div class="engine-status">
            <span class="live-dot"></span>
            <span>60 FPS Active | Dual Keyboard & Mouse</span>
          </div>
          <button id="btnDismiss" class="modal-confirm-btn">DISMISS [ ENTER ]</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
